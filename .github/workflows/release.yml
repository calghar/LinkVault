name: Release Obsidian Plugin

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Attest main.js
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: main.js

      - name: Attest styles.css
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: styles.css

      - name: Read minimum Obsidian version from the manifest
        id: manifest
        run: echo "min_app_version=$(jq -r .minAppVersion manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            main.js
            manifest.json
            styles.css
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## LinkVault ${{ github.ref_name }}

            **Minimum Obsidian version:** ${{ steps.manifest.outputs.min_app_version }}

            See auto-generated changelog below for details.
